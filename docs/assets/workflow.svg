<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 650" width="820" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Intuitive Flow work routes</title>
  <desc id="desc">Work is classified into unsettled bets, repo maintenance, research, or bounded execution. Those routes converge on preflight or direct Flow execution and verification.</desc>
  <defs>
    <style>
      .font { font-family: Aptos, "IBM Plex Sans", "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", "IBM Plex Mono", "SF Mono", Consolas, monospace; }
      .title { font-size: 22px; font-weight: 750; }
      .subtitle { font-size: 12px; font-weight: 600; }
      .section { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
      .small { font-size: 10.5px; font-weight: 620; }
      .tiny { font-size: 9px; font-weight: 620; }
      .lane { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1; }
      .shape { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1; }
      .maint { fill: #eefdf8; stroke: #5eead4; stroke-width: 1; }
      .research { fill: #ecfeff; stroke: #67e8f9; stroke-width: 1; }
      .direct { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; }
      .contract { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; }
      .proof { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="shapeArrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="maintArrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="649" rx="12" fill="#fbfcfe" stroke="#d8e0ea"/>
  <text x="34" y="38" class="font title" fill="#0f172a">Recommended Routes</text>
  <text x="34" y="59" class="font subtitle" fill="#64748b">Choose the smallest route that matches the uncertainty and proof needed</text>

  <g>
    <rect x="34" y="84" width="212" height="58" rx="8" class="direct"/>
    <text x="56" y="108" class="font section" fill="#334155">Work arrives</text>
    <text x="56" y="129" class="mono small" fill="#0f172a">idea · issue · change</text>
  </g>
  <path d="M 246 113 H 294" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="294" y="84" width="224" height="58" rx="8" class="direct"/>
    <text x="316" y="108" class="font section" fill="#334155">Classify the work</text>
    <text x="316" y="129" class="mono small" fill="#0f172a">scope · risk · evidence</text>
  </g>
  <path d="M 518 113 H 566" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="566" y="84" width="220" height="58" rx="8" class="proof"/>
    <text x="588" y="108" class="font section" fill="#1d4ed8">Definition of done</text>
    <text x="588" y="129" class="mono small" fill="#0f172a">acceptance + verification</text>
  </g>

  <rect x="24" y="174" width="374" height="236" rx="10" class="lane"/>
  <rect x="422" y="174" width="374" height="236" rx="10" class="lane"/>

  <g>
    <rect x="46" y="198" width="330" height="72" rx="8" class="shape"/>
    <text x="68" y="224" class="font section" fill="#6d28d9">Unsettled product bet</text>
    <text x="68" y="248" class="mono small" fill="#0f172a">$intuitive-shape</text>
    <text x="68" y="263" class="font tiny" fill="#475569">shape the decision before planning</text>
  </g>
  <path d="M 211 270 V 292" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#shapeArrow)"/>
  <g>
    <rect x="46" y="292" width="330" height="92" rx="8" class="contract"/>
    <text x="68" y="318" class="font section" fill="#334155">Plan or review</text>
    <text x="68" y="342" class="mono tiny" fill="#0f172a">$agent-planning-loop · $cross-review</text>
    <text x="68" y="363" class="font tiny" fill="#475569">then preflight when the contract is ready</text>
  </g>

  <g>
    <rect x="444" y="198" width="330" height="72" rx="8" class="maint"/>
    <text x="466" y="224" class="font section" fill="#0f766e">Maintain or simplify</text>
    <text x="466" y="248" class="mono small" fill="#0f172a">$intuitive-reduce-entropy</text>
    <text x="466" y="263" class="font tiny" fill="#475569">find and rank material cleanup</text>
  </g>
  <path d="M 609 270 V 292" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#maintArrow)"/>
  <g>
    <rect x="444" y="292" width="330" height="92" rx="8" class="maint"/>
    <text x="466" y="318" class="font section" fill="#0f766e">Selected target</text>
    <text x="466" y="342" class="mono tiny" fill="#0f172a">$intuitive-refactor · $intuitive-doc · $intuitive-tests</text>
    <text x="466" y="363" class="font tiny" fill="#475569">finish with proof through Flow</text>
  </g>

  <path d="M 211 384 V 420 H 317 V 586" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 609 384 V 420 H 503 V 586" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="432" width="374" height="126" rx="10" class="lane"/>
  <rect x="422" y="432" width="374" height="126" rx="10" class="lane"/>

  <g>
    <rect x="46" y="456" width="330" height="78" rx="8" class="research"/>
    <text x="68" y="482" class="font section" fill="#0e7490">Evidence needed</text>
    <text x="68" y="506" class="mono small" fill="#0f172a">$research</text>
    <text x="68" y="522" class="font tiny" fill="#475569">trace sources, confidence, and gaps</text>
  </g>
  <g>
    <rect x="444" y="456" width="330" height="78" rx="8" class="direct"/>
    <text x="466" y="482" class="font section" fill="#334155">Tiny or already approved</text>
    <text x="466" y="506" class="mono small" fill="#0f172a">$intuitive-flow</text>
    <text x="466" y="522" class="font tiny" fill="#475569">execute locally and verify directly</text>
  </g>

  <path d="M 211 558 V 586 H 320" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 609 558 V 586 H 500" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="228" y="586" width="178" height="42" rx="8" class="contract"/>
    <text x="250" y="606" class="font section" fill="#334155">Preflight</text>
    <text x="250" y="621" class="mono tiny" fill="#0f172a">$intuitive-preflight</text>
  </g>
  <g>
    <rect x="414" y="586" width="178" height="42" rx="8" class="proof"/>
    <text x="436" y="606" class="font section" fill="#1d4ed8">Execute + verify</text>
    <text x="436" y="621" class="mono tiny" fill="#0f172a">$intuitive-flow</text>
  </g>
</svg>
